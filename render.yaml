services:
  - type: web
    name: smartbus-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: smartbus-db
          property: connectionString

databases:
  - name: smartbus-db
    databaseName: smartbus
    user: smartbus_user
    ipAllowList: []