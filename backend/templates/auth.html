<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#667eea">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SmartBus">
    
    <!-- Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    
    <!-- Iconos -->
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icon-512.png">
    <title>Smart Bus - Login/Registro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 1.5rem;
        }

        h2 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        #registro-div {
            display: none;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input, select {
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 0.75rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .link {
            color: #667eea;
            cursor: pointer;
            text-decoration: underline;
            font-weight: 500;
        }

        .link:hover {
            color: #5568d3;
        }

        #mensaje {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 5px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        #mensaje.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        #mensaje.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        p {
            margin-top: 1rem;
            text-align: center;
            color: #666;
        }

        .info-box {
            padding: 12px;
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            border-radius: 5px;
        }

        .info-box p {
            font-size: 13px;
            color: #666;
            margin: 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚌 Smart Bus</h1>

        <!-- Login (se muestra primero) -->
        <div id="login-div">
            <h2>Iniciar Sesión</h2>
            <form id="form-login">
                <input type="email" name="correo" placeholder="Correo electrónico" required>
                <input type="password" name="contraseña" placeholder="Contraseña" required>
                <button type="submit">Iniciar Sesión</button>
            </form>
            <p>¿No tienes cuenta? <span class="link" id="show-register">Regístrate aquí</span></p>
        </div>

        <!-- Registro (oculto al inicio) -->
        <div id="registro-div">
            <h2>Registro</h2>
            <form id="form-registro">
                <input type="text" name="nombre" placeholder="Nombre completo" required>
                <input type="email" name="correo" placeholder="Correo electrónico" required>
                <input type="password" name="contraseña" placeholder="Contraseña" required minlength="6">
                
                <!-- ✅ Campo oculto CON name -->
                <input type="hidden" name="rol" value="pasajero">
                
                <!-- Información visual -->
                <div class="info-box">
                    <p><strong>Tipo de cuenta:</strong> Pasajero</p>
                    <p style="margin-top: 5px;">ℹ️ Solo puedes registrarte como pasajero. Los conductores son registrados por el administrador.</p>
                </div>
                
                <button type="submit">Registrarse</button>
            </form>
            <p>¿Ya tienes cuenta? <span class="link" id="show-login">Inicia sesión aquí</span></p>
        </div>

        <div id="mensaje"></div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/service-worker.js')
                    .then(registration => {
                        console.log('✅ Service Worker registrado:', registration);
                    })
                    .catch(error => {
                        console.log('❌ Error al registrar Service Worker:', error);
                    });
            });
        }
    </script>
</body>
</html>
